[pytest]
# Put the repo root on sys.path so `import wafpierce` works under a plain
# `pytest` invocation (CI), not just `python -m pytest` (which adds cwd).
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*InsecureRequestWarning.*
