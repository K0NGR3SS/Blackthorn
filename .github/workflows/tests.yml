name: tests

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint (advisory)
        run: ruff check . || true
      - name: Run tests with coverage
        run: pytest -q --cov=wafpierce --cov-report=term-missing --cov-report=xml

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory: the codebase predates type checking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install mypy
      - name: mypy (advisory)
        run: mypy wafpierce --ignore-missing-imports --no-error-summary || true
